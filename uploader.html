<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Uploader — GitHub</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;background:#0f1115;color:#e8eaf0;margin:0;padding:40px 16px}
.card{max-width:640px;margin:0 auto;background:#181b22;border:1px solid #2a2f3a;border-radius:14px;padding:28px}
h1{font-size:1.35rem;margin:0 0 6px}
p.sub{color:#9aa3b2;font-size:.85rem;margin:0 0 20px}
label{display:block;font-size:.78rem;font-weight:700;color:#9aa3b2;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;background:#0f1115;border:1px solid #2a2f3a;color:#e8eaf0;border-radius:8px;padding:10px 12px;font-size:.9rem}
input[type=file]{font-size:.85rem;color:#9aa3b2}
button{margin-top:18px;width:100%;background:#2ea043;color:#fff;border:0;border-radius:8px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer}
button:disabled{background:#2a2f3a;color:#7d8590;cursor:not-allowed}
.bar{height:8px;background:#2a2f3a;border-radius:99px;margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2ea043;transition:width .2s}
#log{margin-top:14px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:#8b949e;max-height:220px;overflow:auto;white-space:pre-wrap;background:#0f1115;border:1px solid #2a2f3a;border-radius:8px;padding:10px}
.ok{color:#3fb950}.err{color:#f85149}
small{color:#7d8590}
</style>
</head>
<body>
<div class="card">
<h1>Site Uploader → GitHub</h1>
<p class="sub">Poora folder ek commit me push karta hai (Git Data API). Token sirf aapke browser me use hota hai, kahin store nahi hota.</p>
<label>GitHub username (naya account)</label>
<input type="text" id="owner" placeholder="e.g. talevault8">
<label>Repository name</label>
<input type="text" id="repo" value="translators">
<label>Fine-grained PAT (Contents: Read and write)</label>
<input type="password" id="token" placeholder="github_pat_…">
<label>Site folder select karo (extracted zip)</label>
<input type="file" id="folder" webkitdirectory directory multiple>
<button id="go" disabled>Upload & Publish</button>
<div class="bar"><i id="fill"></i></div>
<div id="log"></div>
</div>
<script>
var $=function(id){return document.getElementById(id)};
var files=[];
$("folder").onchange=function(){files=Array.from(this.files);$("go").disabled=!(files.length&&$("token").value&&$("owner").value);log(files.length+" files selected");};
$("token").oninput=$("owner").oninput=function(){$("go").disabled=!(files.length&&$("token").value&&$("owner").value);};
function log(m,cls){var el=$("log");el.innerHTML+='<span class="'+(cls||"")+'">'+m+'</span>\n';el.scrollTop=el.scrollHeight;}
function pct(n){$("fill").style.width=n+"%";}
function api(path,method,body){
  return fetch("https://api.github.com"+path,{method:method||"GET",headers:{"Authorization":"Bearer "+$("token").value.trim(),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===204)return null;
    return r.json().then(function(j){if(!r.ok)throw new Error((j&&j.message)||r.status);return j;});
  });
}
function b64(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
$("go").onclick=async function(){
  $("go").disabled=true;
  var owner=$("owner").value.trim(),repo=$("repo").value.trim();
  try{
    log("Checking repo "+owner+"/"+repo+" …");
    var exists=true;
    await api("/repos/"+owner+"/"+repo).catch(function(e){exists=false;return null;});
    if(!exists){log("Repo nahi mila — create kar raha hoon…");await api("/user/repos","POST",{name:repo,public:true,auto_init:false});log("Repo created ✔","ok");}
    var base=null;
    await api("/repos/"+owner+"/"+repo+"/git/ref/heads/main").then(function(r){base=r.object.sha;}).catch(function(){base=null;});
    log("Uploading "+files.length+" blobs …");
    var tree=[];
    for(var i=0;i<files.length;i++){
      var f=files[i];
      var path=(f.webkitRelativePath||f.name).replace(/^[^\/]+\//,"");
      if(!path)continue;
      var buf=await f.arrayBuffer();
      var blob=await api("/repos/"+owner+"/"+repo+"/git/blobs","POST",{content:b64(buf),encoding:"base64"});
      tree.push({path:path,mode:"100644",type:"blob",sha:blob.sha});
      if(i%25===0){pct(Math.round(i/files.length*70));log("  "+i+"/"+files.length);}
    }
    pct(75);log("Tree bana raha hoon…");
    var t=await api("/repos/"+owner+"/"+repo+"/git/trees","POST",{tree:tree});
    pct(85);log("Commit…");
    var c=await api("/repos/"+owner+"/"+repo+"/git/commits","POST",{message:"Translators site — full import",tree:t.sha,parents:base?[base]:[]});
    if(base){await api("/repos/"+owner+"/"+repo+"/git/refs/heads/main","PATCH",{sha:c.sha});}
    else{await api("/repos/"+owner+"/"+repo+"/git/refs","POST",{ref:"refs/heads/main",sha:c.sha});}
    pct(100);log("DONE ✔  https://github.com/"+owner+"/"+repo,"ok");
    log("Ab repo ke Settings → Pages → branch main + / (root) → Save. Phir custom domain translators.mkm.fan.","ok");
  }catch(e){log("ERROR: "+e.message,"err");$("go").disabled=false;}
};
</script>
</body>
</html>

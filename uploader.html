<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Uploader — GitHub (batched)</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;background:#0f1115;color:#e8eaf0;margin:0;padding:40px 16px}
.card{max-width:640px;margin:0 auto;background:#181b22;border:1px solid #2a2f3a;border-radius:14px;padding:28px}
h1{font-size:1.35rem;margin:0 0 6px}
p.sub{color:#9aa3b2;font-size:.85rem;margin:0 0 20px}
label{display:block;font-size:.78rem;font-weight:700;color:#9aa3b2;margin:14px 0 6px}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;background:#0f1115;border:1px solid #2a2f3a;color:#e8eaf0;border-radius:8px;padding:10px 12px;font-size:.9rem}
button{margin-top:18px;width:100%;background:#2ea043;color:#fff;border:0;border-radius:8px;padding:12px;font-size:.95rem;font-weight:700;cursor:pointer}
button:disabled{background:#2a2f3a;color:#7d8590;cursor:not-allowed}
.bar{height:8px;background:#2a2f3a;border-radius:99px;margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2ea043}
#log{margin-top:14px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:#8b949e;max-height:280px;overflow:auto;white-space:pre-wrap;background:#0f1115;border:1px solid #2a2f3a;border-radius:8px;padding:10px}
.ok{color:#3fb950}.err{color:#f85149}
</style>
</head>
<body>
<div class="card">
<h1>Site Uploader → GitHub (v2 batches)</h1>
<p class="sub">Ab 50-50 files ke commits — timeout nahi aana chahiye. Purani files rehti hain, naya add hota hai.</p>
<label>GitHub username</label>
<input type="text" id="owner" value="translators7">
<label>Repository name</label>
<input type="text" id="repo" value="translators">
<label>Fine-grained PAT (Contents: Read and write)</label>
<input type="password" id="token" placeholder="github_pat_…">
<label>Extracted site folder (zip nahi — folder jisme index.html hai)</label>
<input type="file" id="folder" webkitdirectory directory multiple>
<button id="go" disabled>Upload & Publish</button>
<div class="bar"><i id="fill"></i></div>
<div id="log"></div>
</div>
<script>
var $=function(id){return document.getElementById(id)};
var files=[];
$("folder").onchange=function(){files=Array.from(this.files);$("go").disabled=!(files.length&&$("token").value&&$("owner").value);log(files.length+" files selected");};
$("token").oninput=$("owner").oninput=function(){$("go").disabled=!(files.length&&$("token").value&&$("owner").value);};
function log(m,cls){var el=$("log");el.innerHTML+='<span class="'+(cls||"")+'">'+m+'</span>\n';el.scrollTop=el.scrollHeight;}
function pct(n){$("fill").style.width=n+"%";}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function api(path,method,body){
  return fetch("https://api.github.com"+path,{
    method:method||"GET",
    headers:{"Authorization":"Bearer "+$("token").value.trim(),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
    body:body?JSON.stringify(body):undefined
  }).then(function(r){
    if(r.status===204)return null;
    return r.json().then(function(j){
      if(!r.ok)throw new Error((j&&j.message)||("HTTP "+r.status));
      return j;
    });
  });
}
function b64(buf){
  var b=new Uint8Array(buf),s="",i;
  for(i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}
$("go").onclick=async function(){
  $("go").disabled=true;
  var owner=$("owner").value.trim(), repo=$("repo").value.trim();
  var BATCH=40;
  try{
    log("Checking repo "+owner+"/"+repo+" …");
    var exists=true;
    await api("/repos/"+owner+"/"+repo).catch(function(){exists=false;});
    if(!exists){await api("/user/repos","POST",{name:repo,public:true,auto_init:false});log("Repo created ✔","ok");}

    var items=[];
    for(var i=0;i<files.length;i++){
      var f=files[i];
      var path=(f.webkitRelativePath||f.name).replace(/^[^\/]+\//,"");
      if(!path || path.indexOf(".DS_Store")>=0) continue;
      items.push({file:f, path:path});
    }
    log("Will upload "+items.length+" files in batches of "+BATCH);

    var ref=null, commitSha=null, treeSha=null;
    try{
      ref=await api("/repos/"+owner+"/"+repo+"/git/ref/heads/main");
      commitSha=ref.object.sha;
      var c0=await api("/repos/"+owner+"/"+repo+"/git/commits/"+commitSha);
      treeSha=c0.tree.sha;
      log("Existing main: "+commitSha.slice(0,7));
    }catch(e){ log("Empty repo — first commit se start"); }

    var total=items.length, done=0;
    for(var b=0;b<items.length;b+=BATCH){
      var chunk=items.slice(b,b+BATCH);
      var tree=[];
      for(var k=0;k<chunk.length;k++){
        var it=chunk[k];
        var buf=await it.file.arrayBuffer();
        var blob=null, tries=0;
        while(tries<5){
          try{
            blob=await api("/repos/"+owner+"/"+repo+"/git/blobs","POST",{content:b64(buf),encoding:"base64"});
            break;
          }catch(err){
            tries++;
            log("blob retry "+tries+": "+err.message);
            await sleep(1500*tries);
          }
        }
        if(!blob) throw new Error("blob failed: "+it.path);
        tree.push({path:it.path, mode:"100644", type:"blob", sha:blob.sha});
        done++;
        if(done%10===0){pct(Math.round(done/total*90)); log("  blobs "+done+"/"+total);}
      }
      var tBody={tree:tree};
      if(treeSha) tBody.base_tree=treeSha;
      var t=await api("/repos/"+owner+"/"+repo+"/git/trees","POST", tBody);
      treeSha=t.sha;
      var cBody={message:"Import batch "+(Math.floor(b/BATCH)+1)+" ("+done+"/"+total+")", tree:treeSha, parents: commitSha?[commitSha]:[]};
      var c=await api("/repos/"+owner+"/"+repo+"/git/commits","POST", cBody);
      commitSha=c.sha;
      if(ref){
        await api("/repos/"+owner+"/"+repo+"/git/refs/heads/main","PATCH",{sha:commitSha});
      }else{
        await api("/repos/"+owner+"/"+repo+"/git/refs","POST",{ref:"refs/heads/main", sha:commitSha});
        ref=true;
      }
      log("commit "+(Math.floor(b/BATCH)+1)+" ✔  "+commitSha.slice(0,7),"ok");
      await sleep(400);
    }
    pct(100);
    log("DONE ✔  https://github.com/"+owner+"/"+repo,"ok");
    log("Pages: Settings → Pages → branch main + / (root)","ok");
  }catch(e){
    log("ERROR: "+e.message,"err");
    $("go").disabled=false;
  }
};
</script>
</body>
</html>
